name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: airship
          POSTGRES_PASSWORD: airship
          POSTGRES_DB: airship
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U airship" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      # Each database test creates and drops its own database here.
      TEST_DATABASE_URL: postgres://airship:airship@localhost:5432/airship?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            apps/api/tools/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec ultracite check
      - run: pnpm turbo run lint typecheck test build

  generated:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            apps/api/tools/go.sum
      - run: pnpm install --frozen-lockfile
      # Fails when someone changed SQL or Go handlers without regenerating
      # the sqlc code, openapi.json or the TypeScript client.
      - run: pnpm check:generated

  migrations:
    name: Migrations apply and roll back
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: airship
          POSTGRES_PASSWORD: airship
          POSTGRES_DB: airship
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U airship" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://airship:airship@localhost:5432/airship?sslmode=disable
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go run ./cmd/migrate up
      - run: go run ./cmd/migrate reset
      - run: go run ./cmd/migrate up

  aws:
    name: AWS provider (emulated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: astral-sh/setup-uv@v6
      # The EC2 provider's real SDK calls against moto: launches land in the
      # default VPC with the runners' security group, are tagged per
      # installation, and terminate.
      - name: Provider against moto
        working-directory: apps/api
        run: |
          uvx --from 'moto[server]==5.2.4' moto_server -p 5055 > /tmp/moto.log 2>&1 &
          timeout 60 sh -c 'until curl -s localhost:5055 > /dev/null; do sleep 1; done'
          AIRSHIP_AWS_ENDPOINT=http://localhost:5055 go test -count=1 -run TestAgainstEmulator ./internal/cloud/aws

  images:
    name: Container image
    runs-on: ubuntu-latest
    needs: [check, generated, migrations]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pull requests only prove the image builds; main publishes it.
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          target: api
          build-args: VERSION=${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/airship-api:latest
            ghcr.io/${{ github.repository_owner }}/airship-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

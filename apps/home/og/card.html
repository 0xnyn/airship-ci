<!doctype html>
<!--
  The social card for every Airship site. render.mjs loads this page at
  1200x630 with window.CARD set (the variant's copy, the mark and the beam,
  all from @airship/tokens), calls window.render(t) for each moment of a
  seamless loop and screenshots it. Colours come from the tokens' brand.css.
  Change the copy in render.mjs; nothing here runs on a site.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Airship social card</title>
    <link
      href="../../../packages/tokens/src/generated/brand.css"
      rel="stylesheet"
    >
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    >
    <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      color: var(--white);
      background: var(--bg);
    }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    #sky {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Darken the left so the type reads over the light. */
    .shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        color-mix(in srgb, var(--bg) 96%, transparent) 0%,
        color-mix(in srgb, var(--bg) 88%, transparent) 38%,
        color-mix(in srgb, var(--bg) 15%, transparent) 62%,
        transparent 100%
      );
    }

    .copy {
      position: absolute;
      top: 56px;
      bottom: 56px;
      left: 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 560px;
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: -1px;
    }

    .brand svg {
      width: 34px;
      height: 34px;
    }

    .label {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 22px;
      font-family: var(--font-mono);
      font-size: 16px;
      color: var(--white-80);
    }

    .pill {
      width: 18px;
      height: 10px;
      background: var(--accent, var(--white));
      border-radius: var(--radius-full);
    }

    h1 {
      margin-bottom: 22px;
      font-size: 66px;
      font-weight: 500;
      line-height: 68px;
      letter-spacing: -2.8px;
      white-space: pre-line;
    }

    .sub {
      font-family: var(--font-mono);
      font-size: 19px;
      line-height: 28px;
      color: var(--white-80);
      letter-spacing: -0.4px;
    }

    .url {
      display: flex;
      gap: 10px;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 17px;
      color: var(--white-80);
    }

    .url .pill {
      background: var(--dot-yellow);
    }

    /* Runner list */
    .panel {
      position: absolute;
      top: 150px;
      right: -24px;
      width: 520px;
      overflow: hidden;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--white-80);
      background: var(--panel-bg);
      border-radius: var(--radius-md) 0 0 var(--radius-md);
      box-shadow: var(--shadow-hero);
    }

    .bar {
      display: flex;
      justify-content: space-between;
      padding: 16px 48px 16px 22px;
      color: var(--white-50);
      border-bottom: 1px solid var(--line);
    }

    .bar b {
      font-weight: 400;
      color: var(--white);
    }

    .live {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .live i {
      width: 7px;
      height: 7px;
      background: var(--dot-green);
      border-radius: var(--radius-full);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 120px 112px;
      gap: 12px;
      align-items: center;
      padding: 14px 22px;
      white-space: nowrap;
      border-bottom: 1px solid var(--line-faint);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .job {
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--white);
    }

    .label-code {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      color: var(--dot-yellow);
    }

    .machine {
      font-size: 13px;
      color: var(--white-50);
    }

    .state {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .state i {
      width: 7px;
      height: 7px;
      background: var(--white-30);
      border-radius: var(--radius-full);
    }

    .state[data-s="launching"] i {
      background: var(--dot-gold);
    }

    .state[data-s="running"] i {
      background: var(--dot-green);
    }

    .state[data-s="busy"] i {
      background: var(--dot-blue);
    }

    .state[data-s="finished"] {
      color: var(--white-50);
    }
    /* A backdrop only (the docs' page thumbnails write their own title). */
    [data-backdrop] .copy,
    [data-backdrop] .panel {
      display: none;
    }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <svg
        aria-hidden="true"
        id="sky"
        preserveAspectRatio="xMidYMid slice"
      ></svg>
      <div class="shade"></div>

      <div class="copy">
        <div class="brand">
          <svg aria-hidden="true" id="mark"><path></path></svg>
          <span id="name"></span>
        </div>
        <div>
          <p class="label">
            <span class="pill"></span><span id="label"></span>
          </p>
          <h1 id="title">Airship</h1>
          <p class="sub" id="sub"></p>
        </div>
        <p class="url"><span class="pill"></span><span id="url"></span></p>
      </div>

      <div class="panel">
        <div class="bar">
          <span>acme / <b id="section"></b></span>
          <span class="live"><i id="live"></i><span id="busy"></span></span>
        </div>
        <div id="rows"></div>
      </div>
    </div>

    <script>
    "use strict";
    const { beam, brand, copy } = window.CARD;
    const card = document.getElementById("card");

    // The mark and the copy.
    const mark = document.getElementById("mark");
    mark.setAttribute("viewBox", brand.markViewBox);
    mark.firstElementChild.setAttribute("d", brand.mark);
    mark.firstElementChild.setAttribute("fill", "var(--white)");
    mark.firstElementChild.setAttribute("fill-opacity", "0.92");
    document.getElementById("name").textContent = brand.name;
    for (const id of ["label", "title", "sub", "url", "section"]) {
      document.getElementById(id).textContent = copy[id] ?? "";
    }
    if (copy.accent) {
      card.style.setProperty("--accent", `var(--dot-${copy.accent})`);
    }
    if (copy.backdrop) {
      card.dataset.backdrop = "";
    }

    // The sky: the same layers grain-field.astro draws, from the same numbers.
    const g = beam.geometry;
    const stops = (list, withOpacity = true) =>
      list
        .map(
          (s) =>
            `<stop offset="${s.offset}" stop-color="${s.color}"${withOpacity ? ` stop-opacity="${s.opacity}"` : ""} />`
        )
        .join("");
    const sky = document.getElementById("sky");
    sky.setAttribute("viewBox", `0 0 ${g.width} ${g.height}`);
    sky.innerHTML = `<defs>
        <filter color-interpolation-filters="sRGB" height="100%" id="dither" width="100%" x="0" y="0">
          <feTurbulence baseFrequency="${g.grain}" numOctaves="${beam.dither.octaves}" result="noise" seed="${beam.dither.seed}" type="fractalNoise" />
          <feColorMatrix in="noise" result="na" type="matrix" values="${beam.dither.matrix}" />
          <feComposite in="SourceGraphic" in2="na" k1="0" k2="1" k3="1" k4="${beam.dither.threshold}" operator="arithmetic" result="sum" />
          <feComponentTransfer in="sum" result="mask"><feFuncA tableValues="0 1" type="discrete" /></feComponentTransfer>
          <feFlood flood-color="#fff" />
          <feComposite in2="mask" operator="in" />
        </filter>
        <linearGradient gradientTransform="${g.transform}" gradientUnits="userSpaceOnUse" id="beam" x1="${g.x1}" x2="${g.x2}" y1="0" y2="0">${stops(g.across)}</linearGradient>
        <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">${stops(g.down)}</linearGradient>
        <mask id="fade-mask" maskContentUnits="userSpaceOnUse"><rect fill="url(#fade)" height="${g.height}" width="${g.width}" /></mask>
        <linearGradient gradientTransform="${g.transform}" gradientUnits="userSpaceOnUse" id="tint" x1="${g.x1}" x2="${g.x2}" y1="0" y2="0">${stops(g.fringe, false)}</linearGradient>
      </defs>
      <rect fill="#000" height="${g.height}" width="${g.width}" />
      <rect fill="url(#beam)" height="${g.height}" mask="url(#fade-mask)" opacity="${beam.layers.glow}" width="${g.width}" />
      <g filter="url(#dither)" opacity="${beam.layers.grain}"><rect fill="url(#beam)" height="${g.height}" mask="url(#fade-mask)" width="${g.width}" /></g>
      <rect fill="url(#tint)" height="${g.height}" style="mix-blend-mode: multiply" width="${g.width}" />`;

    // The runner list. One pass through the lifecycle per loop; each row
    // starts at a different point, so the list is always mid-flight.
    const LOOP = 6;
    const STATES = [
      "pending",
      "launching",
      "running",
      "busy",
      "busy",
      "busy",
      "finished",
    ];
    const rowsEl = document.getElementById("rows");
    for (const r of copy.rows ?? []) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span class="job"><span></span><span class="label-code"></span></span>
          <span class="machine"></span>
          <span class="state"><i></i><span></span></span>`;
      row.querySelector(".job").firstElementChild.textContent = r.job;
      row.querySelector(".label-code").textContent = r.label;
      row.querySelector(".machine").textContent = r.machine;
      rowsEl.append(row);
    }
    const stateEls = [...rowsEl.querySelectorAll(".state")];
    const live = document.getElementById("live");
    const busyEl = document.getElementById("busy");

    window.render = (t) => {
      const phase = (t % LOOP) / LOOP;
      let busy = 0;
      stateEls.forEach((el, i) => {
        const p = (phase + i * 0.29) % 1;
        const s = STATES[Math.floor(p * STATES.length)];
        if (s === "busy") {
          busy += 1;
        }
        el.dataset.s = s;
        el.lastElementChild.textContent = s;
      });
      busyEl.textContent = `${busy + 11} busy`;
      live.style.opacity = String(
        0.4 + 0.6 * Math.abs(Math.cos(Math.PI * 2 * phase * 3))
      );
    };

    window.render(2.2);
    </script>
  </body>
</html>

packages:
  - apps/*
  - packages/*
  - deploy/*

allowBuilds:
  esbuild: true
  sharp: true

# Varlock replaces Next's env loader so .env.schema validates and types env.
overrides:
  "@next/env": npm:@varlock/nextjs-integration@1.2.5

# Versions shared by more than one package. Reference with "catalog:".
catalog:
  "@tailwindcss/postcss": ^4.3.3
  "@tanstack/react-query": ^5.104.5
  "@tanstack/react-query-devtools": ^5.104.5
  "@types/node": ^26.4.1
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  lucide-react: ^1.41.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  varlock: 1.23.0

# openapi-typescript only uses TypeScript's printer, which is stable across 6.x.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"

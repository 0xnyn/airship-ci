packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  # Mintlify's CLI pulls these in. Scarf is install analytics; keytar is a
  # native keychain binding only `mint login` needs, and the docs are
  # previewed and checked without signing in.
  '@scarf/scarf': false
  keytar: false

# Varlock replaces Next's env loader so .env.schema validates and types env.
overrides:
  "@next/env": npm:@varlock/nextjs-integration@1.2.5

# Versions shared by more than one package. Reference with "catalog:".
catalog:
  "@tailwindcss/postcss": ^4.3.3
  "@tanstack/react-query": ^5.104.5
  "@tanstack/react-query-devtools": ^5.104.5
  "@types/node": ^26.4.1
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  lucide-react: ^1.41.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  varlock: 1.23.0

# openapi-typescript only uses TypeScript's printer, which is stable across 6.x.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"

# Written by pnpm: the Mintlify CLI publishes continuously, so its versions
# are newer than the registry delay this workspace otherwise waits out.
minimumReleaseAgeExclude:
  - '@mintlify/cli@4.0.1760'
  - '@mintlify/common@1.0.1317'
  - '@mintlify/link-rot@3.0.1554'
  - '@mintlify/models@0.0.380'
  - '@mintlify/og@0.0.116'
  - '@mintlify/package-builder@0.0.106'
  - '@mintlify/prebuild@1.0.1489'
  - '@mintlify/previewing@4.0.1572'
  - '@mintlify/scraping@4.0.1195'
  - '@mintlify/validation@0.1.948'
  - mint@4.2.1157
